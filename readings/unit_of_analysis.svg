<svg viewBox="0 0 900 332" xmlns="http://www.w3.org/2000/svg">
  <title>Unit of Analysis — individual versus state level</title>
  <desc>Diagram showing that the same research question — what explains voting behavior in the 2024 presidential election — can be studied at two levels. On the left, the unit of analysis is the individual voter, illustrated by a table with columns for Respondent, Vote Choice, and Economy, with three example rows. On the right, the unit of analysis is the U.S. state, illustrated by a table with columns for State, Percent Republican Vote, and Unemployment, with three example rows for Pennsylvania, Michigan, and Georgia.</desc>
  <rect width="900" height="332" fill="white"/>
  <rect x="100" y="10" width="700" height="44" rx="6" fill="#eef3fb" stroke="#1E407C" stroke-width="1.5"/>
  <text x="450" y="28" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" fill="#555" font-style="italic">Research question:</text>
  <text x="450" y="46" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1E407C">What explains voting behavior in the 2024 presidential election?</text>
  <text x="450" y="100" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#aaa">OR</text>
  <line x1="340" y1="54" x2="240" y2="84" stroke="#bbb" stroke-width="1.5"/>
  <line x1="560" y1="54" x2="660" y2="84" stroke="#bbb" stroke-width="1.5"/>
  <rect x="20" y="82" width="400" height="196" rx="6" fill="#f0f4fb" stroke="#1E407C" stroke-width="2"/>
  <rect x="20" y="82" width="400" height="32" rx="6" fill="#1E407C"/>
  <rect x="20" y="102" width="400" height="12" fill="#1E407C"/>
  <text x="220" y="102" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white">Unit of Analysis: Individual Voter</text>
  <rect x="26" y="120" width="388" height="26" rx="2" fill="#dce6f5"/>
  <text x="30" y="133" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E407C">Respondent</text>
  <text x="162" y="133" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E407C">Vote Choice</text>
  <text x="288" y="133" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E407C">Economy</text>
  <rect x="26" y="146" width="388" height="32" fill="white"/>
  <text x="30" y="162" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Person 1</text>
  <text x="162" y="162" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Republican</text>
  <text x="288" y="162" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Worse</text>
  <rect x="26" y="178" width="388" height="32" fill="#f5f8fd"/>
  <text x="30" y="194" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Person 2</text>
  <text x="162" y="194" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Democrat</text>
  <text x="288" y="194" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Better</text>
  <rect x="26" y="210" width="388" height="32" fill="white"/>
  <text x="30" y="226" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Person 3</text>
  <text x="162" y="226" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Republican</text>
  <text x="288" y="226" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Worse</text>
  <text x="26" y="264" font-family="Arial, sans-serif" font-size="12" fill="#888" font-style="italic">Each row is one person.</text>
  <rect x="480" y="82" width="400" height="196" rx="6" fill="#f0f7f2" stroke="#1a5c32" stroke-width="2"/>
  <rect x="480" y="82" width="400" height="32" rx="6" fill="#1a5c32"/>
  <rect x="480" y="102" width="400" height="12" fill="#1a5c32"/>
  <text x="680" y="102" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white">Unit of Analysis: U.S. State</text>
  <rect x="486" y="120" width="388" height="26" rx="2" fill="#d4edda"/>
  <text x="490" y="133" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a5c32">State</text>
  <text x="600" y="133" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a5c32">% Rep. Vote</text>
  <text x="748" y="133" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a5c32">Unemployment</text>
  <rect x="486" y="146" width="388" height="32" fill="white"/>
  <text x="490" y="162" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Pennsylvania</text>
  <text x="600" y="162" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">50.1%</text>
  <text x="748" y="162" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">4.2%</text>
  <rect x="486" y="178" width="388" height="32" fill="#f0f7f2"/>
  <text x="490" y="194" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Michigan</text>
  <text x="600" y="194" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">49.7%</text>
  <text x="748" y="194" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">4.5%</text>
  <rect x="486" y="210" width="388" height="32" fill="white"/>
  <text x="490" y="226" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Georgia</text>
  <text x="600" y="226" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">50.7%</text>
  <text x="748" y="226" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">3.9%</text>
  <text x="486" y="264" font-family="Arial, sans-serif" font-size="12" fill="#888" font-style="italic">Each row is one state.</text>
  <text x="450" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666" font-style="italic">The same research question can be studied at different levels.</text>
  <text x="450" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666" font-style="italic">The unit of analysis determines what each row in the data represents.</text>
</svg>