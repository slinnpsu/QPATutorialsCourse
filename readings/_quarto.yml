# Shared configuration for the PLSC 309H course readings.
#
# Every setting that was identical across the five reading .qmd files lives
# here, so each reading's own YAML now carries only its title. Anything set
# inside a .qmd overrides what is set here.
#
# project: type: default renders each file in place, next to its source,
# rather than into a _site/ directory.

project:
  type: default

author: "Suzanna Linn"
date: last-modified

format:
  html:
    embed-resources: true
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    toc-location: left
    theme: cosmo
    css: readings.css
    number-sections: false
    df-print: paged
    lang: en
    link-external-newwindow: false
    # The readings use no margin content, so the column Quarto reserves for
    # sidenotes is reclaimed here. Adjust body-width by eye after rendering.
    grid:
      sidebar-width: 320px
      body-width: 900px
      margin-width: 0px

execute:
  echo: false
  warning: false
  message: false
