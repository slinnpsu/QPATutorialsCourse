<svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
  <title>The Research Process — seven steps</title>
  <desc>Flowchart of the research process divided into two phases. Research Design: step 1 Develop a Question, step 2 Develop a Theory, step 3 Research Design, step 4 Specify Hypotheses. Data Analysis: step 5 Collect and Clean Data, step 6 Analyze the Data, step 7 Evaluate.</desc>
